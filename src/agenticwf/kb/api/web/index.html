<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="kb-base" content="{{BASE}}">
<meta name="kb-mode" content="{{MODE}}">
<title>AgenticWF KB</title>
<meta name="color-scheme" content="light dark">
<style>
:root{--bg:#fff;--fg:#1d2330;--muted:#5d6676;--line:#dde1e8;--panel:#f6f7f9;--accent:#2457c5;--bad:#b42318;--ok:#18794e;--warn:#9a6700}
@media (prefers-color-scheme:dark){:root{--bg:#14171c;--fg:#e4e7ec;--muted:#98a2b3;--line:#2c323b;--panel:#1b1f26;--accent:#7aa2ff;--bad:#f97066;--ok:#47cd89;--warn:#fdb022}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:14px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif}
header{display:flex;gap:12px;align-items:center;padding:10px 16px;border-bottom:1px solid var(--line)}
header h1{font-size:16px;margin:0;flex:1}
header .who{color:var(--muted)}
main{display:grid;grid-template-columns:260px 1fr;min-height:calc(100vh - 49px)}
@media (max-width:760px){main{grid-template-columns:1fr}}
aside{border-right:1px solid var(--line);padding:12px;background:var(--panel)}
section{padding:12px 16px;min-width:0}
h2{font-size:15px;margin:0 0 8px}
h3{font-size:13px;margin:16px 0 6px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
button,input,select,textarea{font:inherit;color:inherit}
button{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 10px;cursor:pointer}
button.primary{background:var(--accent);border-color:var(--accent);color:#fff}
button:disabled{opacity:.5;cursor:default}
input,select,textarea{border:1px solid var(--line);background:var(--bg);border-radius:6px;padding:4px 8px;max-width:100%}
textarea{width:100%;min-height:70px}
.kb-list{list-style:none;padding:0;margin:0}
.kb-list li{padding:6px 8px;border-radius:6px;cursor:pointer;display:flex;justify-content:space-between;gap:6px}
.kb-list li.active{background:var(--bg);outline:1px solid var(--line)}
.kb-list small{color:var(--muted)}
.kb-list li.kb-group{cursor:default;padding:10px 8px 2px;font-size:12px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
.tabs{display:flex;gap:4px;border-bottom:1px solid var(--line);margin:8px 0 12px;flex-wrap:wrap}
.tabs button{border:none;border-bottom:2px solid transparent;border-radius:0;background:none;padding:6px 10px}
.tabs button.on{border-bottom-color:var(--accent);color:var(--accent)}
table{width:100%;border-collapse:collapse}
th,td{text-align:left;padding:6px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--muted);font-weight:500;font-size:12px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;margin:6px 0}
.muted{color:var(--muted)}
.badge{display:inline-block;padding:0 6px;border-radius:10px;font-size:12px;border:1px solid var(--line)}
.badge.completed,.badge.live,.badge.enabled{color:var(--ok)}
.badge.failed{color:var(--bad)}
.badge.pending,.badge.processing,.badge.finalizing,.badge.crawling{color:var(--warn)}
.hit{border:1px solid var(--line);border-radius:8px;padding:8px 10px;margin:8px 0}
.hit .meta{color:var(--muted);font-size:12px}
.hit pre,.passage{white-space:pre-wrap;word-break:break-word;margin:6px 0 0;font:13px/1.45 ui-monospace,SFMono-Regular,Menlo,monospace}
.answer{white-space:pre-wrap;border-left:3px solid var(--accent);padding:4px 10px;margin:8px 0}
sup.cite{color:var(--accent);cursor:help}
.trail{font-size:12px;color:var(--muted);max-height:220px;overflow:auto;border:1px dashed var(--line);border-radius:6px;padding:6px}
.error{color:var(--bad)}
.hidden{display:none}
.split{display:grid;grid-template-columns:240px 1fr;gap:16px}
@media (max-width:900px){.split{grid-template-columns:1fr}}
.page-list{max-height:70vh;overflow:auto;font-size:13px}
.page-list h4{margin:10px 0 4px;color:var(--muted);font-size:12px}
.page-list a{display:block;padding:2px 4px;border-radius:4px;color:var(--fg);text-decoration:none;cursor:pointer}
.page-list a.on,.page-list a:hover{background:var(--panel)}
.wiki-page{line-height:1.6}
.wiki-page h1{font-size:20px}.wiki-page h2{font-size:16px}.wiki-page h3{font-size:14px}
.wiki-page a.wl{color:var(--accent);cursor:pointer;text-decoration:none;border-bottom:1px dotted var(--accent)}
.wiki-page a.dead{color:var(--bad)}
sup.src{color:var(--muted);font-size:10px}
.kv{display:grid;grid-template-columns:max-content 1fr;gap:2px 12px;font-size:13px}
.ok-check{color:var(--ok)}.bad-check{color:var(--bad)}
.side-link{display:block;padding:6px 8px;border-radius:6px;cursor:pointer;margin-top:8px}
.side-link.active{background:var(--bg);outline:1px solid var(--line)}
pre.json{white-space:pre-wrap;font:12px ui-monospace,Menlo,monospace;background:var(--panel);padding:8px;border-radius:6px;max-height:320px;overflow:auto}
</style>
</head>
<body>
<header>
  <h1>AgenticWF knowledge base</h1>
  <span class="who" id="who"></span>
  <form id="logout" class="hidden" method="post"><button>Sign out</button></form>
</header>
<main>
  <aside>
    <h2>Knowledge bases</h2>
    <ul class="kb-list" id="kbs"></ul>
    <a class="side-link hidden" id="memory-link">🧠 My memory</a>
    <a class="side-link hidden" id="remotes-link">🔗 Remote knowledge bases</a>
    <a class="side-link hidden" id="web-link">🔎 Web search</a>
    <a class="side-link hidden" id="prompts-link">📝 Prompts</a>
    <a class="side-link hidden" id="tools-link">🧰 Agent tools</a>
    <p class="muted hidden" id="my-groups" title="From your sign-in: organization (org:), roles (role:), identity-provider groups (idp:). Share with these through 'groups' visibility."></p>
    <h3>New knowledge base</h3>
    <form id="new-kb">
      <div class="row"><input name="name" placeholder="Name" required style="flex:1"></div>
      <div class="row">
        <select name="type" id="new-kb-type"><option value="document">documents</option><option value="faq">FAQ</option></select>
        <button class="primary">Create</button>
      </div>
      <label class="row muted hidden" id="new-kb-wiki"><input type="checkbox" name="wiki"> build an LLM wiki</label>
      <label class="row muted hidden" id="new-kb-memory"><input type="checkbox" name="memory"> feed documents into my memory</label>
    </form>
  </aside>
  <section>
    <div id="empty" class="muted">Choose a knowledge base.</div>
    <div id="kb-view" class="hidden">
      <h2 id="kb-title"></h2>
      <div class="muted" id="kb-meta"></div>
      <div class="tabs" id="tabs"></div>
      <div id="pane"></div>
    </div>
  </section>
</main>
<script>
"use strict";
// KB_BASE_PATH as the browser sees it: a proxy may serve it under a prefix it strips (AgenticWF's
// single-host Caddy serves /kb at /app/kb), so take it from this page's own URL when that ends in it.
const BASE = (() => {
  const base = document.querySelector('meta[name="kb-base"]').content;
  const path = location.pathname.replace(/\/+$/, "");
  return path.endsWith(base) ? path : base;
})();
const MODE = document.querySelector('meta[name="kb-mode"]').content;
const API = BASE + "/api/v1";
// Browser login (/auth/session, /auth/logout): the KB itself in standalone mode; authsvc at the
// proxy's prefix otherwise (/app/auth/* when the KB is at /app/kb, /auth/* when it is at /kb).
const AUTH = MODE === "standalone" ? BASE
  : BASE.slice(0, BASE.length - document.querySelector('meta[name="kb-base"]').content.length);
let state = {kbs: [], kb: null, tab: "documents", me: null};
let FEATURES = {};
let PRESETS = [];                 // /agentic-search/presets: which exist, which is the default

const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const $ = id => document.getElementById(id);

async function api(path, opts = {}) {
  const init = {credentials: "same-origin", ...opts, headers: {...(opts.headers || {})}};
  if (opts.json !== undefined) { init.body = JSON.stringify(opts.json); init.headers["Content-Type"] = "application/json"; }
  const r = await fetch(API + path, init);
  let body = null;
  try { body = await r.json(); } catch (_) {}
  if (!r.ok || !body || body.success === false) throw new Error(body?.error?.message || ("HTTP " + r.status));
  return body;
}

function fail(where, e) { where.insertAdjacentHTML("afterbegin", `<p class="error">${esc(e.message || e)}</p>`); }

// The groups you may share with ('groups' visibility), as /me reports them.
const myGroups = () => (state.me && state.me.groups) || [];
// A group as people know it: an organization's name, with the id stored on KBs and items.
const groupLabel = g => { const n = ((state.me && state.me.group_names) || {})[g]; return n ? `${n} (${g})` : g; };
const groupsText = gs => gs.map(groupLabel).join(", ");
const plural = (n, word, many = word + "s") => `${n} ${n === 1 ? word : many}`;

async function loadMe() {
  try {
    const me = state.me = (await api("/me")).data;
    $("who").textContent = `${me.subject} · ${MODE}`;
    if (MODE !== "standalone") {
      $("my-groups").textContent = myGroups().length ? `Your groups: ${groupsText(myGroups())}` : "You are in no groups yet.";
      if (MODE === "authsvc") $("my-groups").insertAdjacentHTML("beforeend", ` <a href="${esc(AUTH)}/admin#groups">Groups…</a>`);
      $("my-groups").classList.remove("hidden");
    }
  } catch (e) { $("who").textContent = "not signed in"; }
  if (MODE !== "service") {
    // The session knows the signed-in user's name and email; the KB only sees the subject id.
    try {
      const r = await fetch(AUTH + "/auth/session", {credentials: "same-origin"});
      const s = r.ok ? await r.json() : null;
      if (s && s.authenticated) {
        const u = s.user || {};
        $("who").textContent = `${u.email || u.name || u.username || u.id} · ${MODE}`;
        $("logout").action = AUTH + "/auth/logout";
        $("logout").classList.remove("hidden");
      }
    } catch (_) {}
  }
  try {
    const info = (await api("/system/info")).data;
    FEATURES = info.features || {};
    const d = info.kb_defaults || {};
    for (const [name, on] of [["wiki", d.wiki_enabled], ["memory", d.memory_enabled]])
      $("new-kb").elements[name].defaultChecked = !!on;
  } catch (_) { FEATURES = {}; }
  if (FEATURES.remote || MODE === "standalone") { $("remotes-link").classList.remove("hidden"); $("remotes-link").onclick = openRemotes; }
  if (FEATURES.records) $("new-kb-type").insertAdjacentHTML("beforeend", '<option value="records">records</option>');
  if (FEATURES.wiki) $("new-kb-wiki").classList.remove("hidden");
  if (FEATURES.memory) $("new-kb-memory").classList.remove("hidden");
  if (FEATURES.memory) { $("memory-link").classList.remove("hidden"); $("memory-link").onclick = openMemory; }
  if (FEATURES.web) { $("web-link").classList.remove("hidden"); $("web-link").onclick = openWeb; }
  if (isAdmin()) { $("prompts-link").classList.remove("hidden"); $("prompts-link").onclick = openPrompts; }
  if (isAdmin()) { $("tools-link").classList.remove("hidden"); $("tools-link").onclick = openTools; }
  try { PRESETS = (await api("/agentic-search/presets")).data; } catch (_) { PRESETS = []; }
}

const isAdmin = () => ((state.me && state.me.scopes) || []).includes("admin");

// Mark the open page in the sidebar: a side link's id, or null (a knowledge base).
function activate(linkId) {
  document.querySelectorAll(".side-link").forEach(a => a.classList.toggle("active", a.id === linkId));
  if (linkId) document.querySelectorAll(".kb-list li").forEach(li => li.classList.remove("active"));
}

// A page of its own (not a knowledge base): title, explanation, no tabs, the URL hash.
function openPage(linkId, title, meta, hash) {
  state.kb = null;
  activate(linkId);
  $("empty").classList.add("hidden"); $("kb-view").classList.remove("hidden");
  $("kb-title").textContent = title; $("kb-meta").textContent = meta; $("tabs").innerHTML = "";
  history.replaceState(null, "", "#" + hash);
  return $("pane");
}

const wikiOn = kb => FEATURES.wiki && kb.indexing_strategy && kb.indexing_strategy.wiki_enabled;

// Every KB the user can read: their own, shared with them, system ones, then each remote's
// (docs/retrieval.md, Remote knowledge bases).
function kbGroup(kb) {
  if (kb.remote) return `From ${kb.remote}`;
  if (state.me && kb.owner_subject === state.me.subject) return "Mine";
  return kb.owner_subject === "system" ? "System" : "Shared with me";
}

async function loadKbs(select) {
  let kbs = [];
  for (let page = 1; ; page++) {
    const body = await api(`/knowledge-bases?page_size=100&page=${page}`);
    kbs = kbs.concat(body.data);
    if (!body.data.length || kbs.length >= (body.total ?? 0)) break;
  }
  state.kbs = kbs;
  const groups = new Map();
  for (const kb of kbs) { const g = kbGroup(kb); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(kb); }
  const ul = $("kbs");
  const order = g => ["Mine", "Shared with me", "System"].indexOf(g) + 1 || 4;
  ul.innerHTML = [...groups].sort((a, b) => order(a[0]) - order(b[0])).map(([g, list]) => `<li class="kb-group">${esc(g)}</li>` + list.map(kb =>
    `<li data-id="${esc(kb.id)}" class="${state.kb && state.kb.id === kb.id ? "active" : ""}" title="${esc(kb.ref)}">
    <span>${esc(kb.name)}${kb.type !== "document" ? ` <span class="badge">${esc(kb.type)}</span>` : ""}${wikiOn(kb) ? ' <span class="badge">wiki</span>' : ""}</span>
    <small>${kb.knowledge_count ?? ""}</small></li>`).join("")).join("");
  ul.querySelectorAll("li[data-id]").forEach(li => li.onclick = () => openKb(li.dataset.id));
  if (select) openKb(select);
}

function tabsFor(kb) {
  if (kb.remote) return [["search", "Search"]];          // remote KBs are read-only here
  const common = [["search", "Search"], ["agentic", "Agentic search"], ["tags", "Tags"]];
  if (kb.type === "faq") return [["faq", "Entries"], ...common, ["settings", "Settings"]];
  if (kb.type === "records") return [["records", "Records"], ["query", "Query"], ["types", "Record types"],
                                     ["search", "Search"], ["agentic", "Agentic search"], ["settings", "Settings"]];
  return [["documents", "Documents"], ...(wikiOn(kb) ? [["wiki", "Wiki"]] : []), ...common,
          ["freshness", "Freshness"], ["settings", "Settings"]];
}

async function openKb(id) {
  state.kb = state.kbs.find(k => k.id === id) || (await api(`/knowledge-bases/${id}`)).data;
  const tabs = tabsFor(state.kb);
  if (!tabs.some(([t]) => t === state.tab)) state.tab = tabs[0][0];
  $("empty").classList.add("hidden"); $("kb-view").classList.remove("hidden"); activate(null);
  $("kb-title").textContent = state.kb.name;
  $("kb-meta").textContent = `${state.kb.ref} · ${state.kb.visibility}${(state.kb.groups || []).length ? " (" + groupsText(state.kb.groups) + ")" : ""} · ${state.kb.type}${state.kb.remote ? ` · read-only, from ${state.kb.remote_url}` : ""}`;
  $("tabs").innerHTML = tabs.map(([t, label]) => `<button data-t="${t}" class="${t === state.tab ? "on" : ""}">${label}</button>`).join("");
  $("tabs").querySelectorAll("button").forEach(b => b.onclick = () => { state.tab = b.dataset.t; openKb(id); });
  document.querySelectorAll(".kb-list li").forEach(li => li.classList.toggle("active", li.dataset.id === id));
  const pane = $("pane"); pane.innerHTML = "";
  history.replaceState(null, "", `#kb=${encodeURIComponent(id)}&tab=${state.tab}`);
  try { await PANES[state.tab](pane, state.kb, state.page); } catch (e) { fail(pane, e); }
  state.page = undefined;
}

function openFromHash() {
  const h = new URLSearchParams(location.hash.slice(1));
  if (h.has("memory")) { state.memoryTab = h.get("memory") || "facts"; return openMemory(); }
  if (h.has("remotes")) return openRemotes();
  if (h.has("web") && FEATURES.web) return openWeb();
  if (h.has("prompts") && isAdmin()) return openPrompts();
  if (h.has("tools") && isAdmin()) return openTools();
  if (h.get("kb")) { state.tab = h.get("tab") || state.tab; state.page = h.get("page") || undefined; return openKb(h.get("kb")); }
}

// --- documents ------------------------------------------------------------------------------
async function documentsPane(pane, kb) {
  pane.innerHTML = `
    <form id="upload" class="row">
      <input type="file" name="file" required>
      <select name="visibility"><option value="">default visibility</option><option>private</option><option>groups</option><option>all</option></select>
      <button class="primary">Upload</button>
      <details style="flex-basis:100%"><summary class="muted">Source citation (optional: otherwise taken from the document itself)</summary>
        <div class="row"><input name="authors" placeholder="authors (separate with ;)" style="flex:1"><input name="published" placeholder="published (YYYY-MM-DD)">
          <input name="publisher" placeholder="publisher"><input name="version" placeholder="version"></div>
        <div class="row"><input name="source_url" placeholder="source URL" style="flex:1"><input name="doi" placeholder="DOI"></div>
        <div class="row"><input name="citation_text" placeholder="or the full citation as you want it shown" style="flex:1"></div>
      </details>
    </form>
    <form id="add-url" class="row"><input name="url" type="url" placeholder="https://… (a page to ingest)" style="flex:1" required>
      <label class="muted" title="Import every page under this URL; Refresh later picks up changed, new and removed pages"><input type="checkbox" name="site"> whole site</label>
      <input name="max_pages" type="number" min="1" max="5000" placeholder="max pages" title="at most this many pages (default 500)" style="width:8em" class="hidden">
      <button>Add URL</button></form>
    <details id="redact-box"><summary class="muted">Remove sensitive text (bank details, personal data …) from this knowledge base</summary>
      <form id="redact" class="row"><textarea name="terms" rows="2" placeholder="text to remove, one per line (e.g. an IBAN or account number)" style="flex:1" required></textarea>
        <label class="muted"><input type="checkbox" name="regex"> regular expressions</label>
        <button name="preview">Preview</button><button type="button" name="apply" class="primary" disabled>Redact</button></form>
      <div id="redact-out" class="muted"></div></details>
    <div id="sites"></div>
    <table><thead><tr><th>Title</th><th>Status</th><th>Visibility</th><th>Version</th><th></th></tr></thead><tbody id="docs"></tbody></table>
    <div class="row muted" id="docs-more"></div>`;
  $("upload").onsubmit = async ev => {
    ev.preventDefault();
    const form = new FormData(ev.target);
    for (const k of ["visibility", "authors", "published", "publisher", "version", "source_url", "doi", "citation_text"])
      if (!form.get(k)) form.delete(k);
    try { await api(`/knowledge-bases/${kb.id}/knowledge/file`, {method: "POST", body: form}); ev.target.reset(); await listDocs(kb); }
    catch (e) { fail(pane, e); }
  };
  const redactBody = dry => { const f = $("redact"), rules = f.terms.value.split("\n").map(s => s.trim()).filter(Boolean);
    return {[f.regex.checked ? "patterns" : "terms"]: rules, dry_run: dry}; };
  $("redact").terms.oninput = () => { $("redact").apply.disabled = true; };
  $("redact").onsubmit = async ev => {
    ev.preventDefault();
    try {
      const r = (await api(`/knowledge-bases/${kb.id}/redact`, {method: "POST", json: redactBody(true)})).data;
      $("redact-out").innerHTML = r.matches ? `<p>${plural(r.matches, "match", "matches")} in ${plural(r.items.length, "document")}${r.wiki.pages ? ` and ${plural(r.wiki.pages, "wiki page")}` : ""}:</p>` +
        r.items.map(i => `<div><b>${esc(i.title)}</b> (${i.matches})${i.error ? ` <span class="error">${esc(i.error)}</span>` : ""}${i.previews.map(p => `<pre>${esc(p)}</pre>`).join("")}</div>`).join("")
        : "<p>No matches.</p>";
      ev.target.apply.disabled = !r.matches;
    } catch (e) { fail($("redact-out"), e); }
  };
  $("redact").apply.onclick = async () => {
    if (!confirm("Replace every match with [REDACTED]? The original files of the affected documents are deleted; this cannot be undone.")) return;
    try {
      const r = (await api(`/knowledge-bases/${kb.id}/redact`, {method: "POST", json: redactBody(false)})).data;
      $("redact-out").innerHTML = `<p>Redacted ${plural(r.matches, "match", "matches")} in ${plural(r.items.length, "document")}; re-indexing.</p>`;
      $("redact").reset(); $("redact").apply.disabled = true; listDocs(kb);
    } catch (e) { fail($("redact-out"), e); }
  };
  $("add-url").site.onchange = ev => $("add-url").max_pages.classList.toggle("hidden", !ev.target.checked);
  $("add-url").onsubmit = async ev => {
    ev.preventDefault();
    const f = ev.target;
    try {
      if (f.site.checked) await api(`/knowledge-bases/${kb.id}/sites`, {method: "POST", json: {url: f.url.value, ...(f.max_pages.value ? {max_pages: +f.max_pages.value} : {})}});
      else await api(`/knowledge-bases/${kb.id}/knowledge/url`, {method: "POST", json: {url: f.url.value}});
      f.reset(); f.max_pages.classList.add("hidden"); await listDocs(kb);
    }
    catch (e) { fail(pane, e); }
  };
  await listDocs(kb);
}

async function listSites(kb) {
  const sites = (await api(`/knowledge-bases/${kb.id}/sites`)).data;
  const stats = s => { const t = s.stats || {}; return t.discovered === undefined ? "" :
    `last crawl: ${t.discovered} found, ${t.added} added, ${t.refreshed} checked for changes, ${t.removed} removed` +
    (t.skipped ? `, ${t.skipped} already in the KB` : "") + (t.unreachable ? `, ${t.unreachable} unreachable` : "") + (t.truncated ? " · stopped at max pages" : ""); };
  $("sites").innerHTML = sites.length ? `<h3>Sites</h3><table><thead><tr><th>Site</th><th>Status</th><th>Pages</th><th></th></tr></thead><tbody>${sites.map(s => `<tr data-id="${esc(s.id)}">
    <td>${link(s.title || s.url, s.url)}<div class="muted">${esc(stats(s))}${s.last_crawled_at ? ` · ${esc(new Date(s.last_crawled_at).toLocaleString())}` : ""}</div></td>
    <td><span class="badge ${esc(s.status)}">${esc(s.status)}</span>${s.error_message ? `<div class="error">${esc(s.error_message)}</div>` : ""}</td>
    <td>${s.pages}</td>

async function listDocs(kb) {
  listSites(kb).catch(() => {});
  const body = await api(`/knowledge-bases/${kb.id}/knowledge?page_size=100`);
  $("docs").innerHTML = body.data.map(d => `<tr data-id="${esc(d.id)}">
    <td>${esc(d.title || d.file_name || d.source)}<div class="muted">${esc((d.citation || {}).text || d.file_name || d.source || d.type)}</div></td>
    <td><span class="badge ${esc(d.parse_status)}">${esc(d.parse_status)}</span>${d.enable_status !== "enabled" ? ' <span class="badge">disabled</span>' : ""}${d.superseded_by?.length ? ' <span class="badge">superseded</span>' : ""}${d.error_message ? `<div class="error">${esc(d.error_message)}</div>` : ""}</td>
    <td><select data-act="vis">${["private", "groups", "all"].map(v => `<option ${v === d.visibility ? "selected" : ""}>${v}</option>`).join("")}</select></td>
    <td>${d.version}</td>
    <td><button data-act="chunks">Passages</button> <button data-act="redact">Redact</button> <button data-act="cite">Citation</button> <button data-act="reparse">Reparse</button> <button data-act="del">Delete</button></td></tr>
    <tr class="hidden" data-chunks="${esc(d.id)}"><td colspan="5"></td></tr>`).join("") ||
    `<tr><td colspan="5" class="muted">No documents yet.</td></tr>`;
  $("docs-more").textContent = body.total > body.data.length ? `${body.total} documents; showing ${body.data.length}.` : "";
  $("docs").querySelectorAll("tr[data-id]").forEach(tr => {
    const id = tr.dataset.id;
    tr.querySelector('[data-act="del"]').onclick = async () => { if (confirm("Delete this document? Its text, file, passages and the memory it fed are removed now.")) { await api(`/knowledge/${id}`, {method: "DELETE"}); listDocs(kb); } };
    tr.querySelector('[data-act="reparse"]').onclick = async () => { await api(`/knowledge/${id}/reparse`, {method: "POST"}); listDocs(kb); };
    tr.querySelector('[data-act="chunks"]').onclick = () => {
      const row = $("docs").querySelector(`tr[data-chunks="${CSS.escape(id)}"]`);
      row.classList.toggle("hidden");
      if (row.classList.contains("hidden")) openChunks.delete(id);
      else { openChunks.add(id); showChunks(row.firstElementChild, id, 1); }
    };
    if (openChunks.has(id)) {
      const row = $("docs").querySelector(`tr[data-chunks="${CSS.escape(id)}"]`);
      row.classList.remove("hidden"); showChunks(row.firstElementChild, id, 1);
    }
    tr.querySelector('[data-act="redact"]').onclick = async () => {
      const term = prompt("Text to remove from this document everywhere it is kept (its file, passages, summary, versions):");
      if (!term || !term.trim()) return;
      try {
        const p = (await api(`/knowledge/${id}/redact`, {method: "POST", json: {terms: [term.trim()], dry_run: true}})).data;
        if (!p.matches) { alert("No matches."); return; }
        if (!confirm(`${p.matches} matches, e.g.\n\n${p.previews.join("\n\n")}\n\nReplace them with [REDACTED]? The original file is deleted; this cannot be undone.`)) return;
        await api(`/knowledge/${id}/redact`, {method: "POST", json: {terms: [term.trim()]}});
      } catch (e) { alert(e.message); }
      listDocs(kb);
    };
    tr.querySelector('[data-act="cite"]').onclick = async () => {
      const d = body.data.find(x => x.id === id), c = d.citation || {};
      const text = prompt("Citation shown with this document's passages (empty: take it from the document again)", c.text || "");
      if (text === null) return;
      try { await api(`/knowledge/${id}`, {method: "PUT", json: {citation: text.trim() ? {citation_text: text.trim()} : null}}); } catch (e) { alert(e.message); }
      listDocs(kb);
    };
    tr.querySelector('[data-act="vis"]').onchange = async ev => {
      const visibility = ev.target.value;
      const groups = visibility === "groups" ? (prompt(`Groups (comma separated). Yours: ${groupsText(myGroups()) || "none"}`, myGroups().join(", ")) || "").split(",").map(s => s.trim()).filter(Boolean) : [];
      try { await api(`/knowledge/${id}`, {method: "PUT", json: {visibility, groups}}); } catch (e) { alert(e.message); }
      listDocs(kb);
    };
  });
}

// A document's passages (chunks): what search returns. Editing or deleting one changes search
// only; to remove text for good use Redact (it also cleans the stored file and versions).
const openChunks = new Set();
async function showChunks(cell, id, page) {
  let body;
  try { body = await api(`/chunks/${id}?page=${page}&page_size=20`); } catch (e) { cell.innerHTML = ""; fail(cell, e); return; }
  const pages = Math.max(1, Math.ceil(body.total / 20));
  cell.innerHTML = `<p class="muted">${plural(body.total, "passage")}. Editing or deleting a passage changes search only; the document keeps the text (a reparse brings it back). Use <b>Redact</b> to remove text for good.</p>` +
    body.data.map(c => `<div class="hit" data-c="${esc(c.id)}"><div class="meta muted">#${c.chunk_index} · ${esc(c.chunk_type)}${c.is_enabled ? "" : " · disabled"}${c.context_header ? ` · ${esc(c.context_header)}` : ""}</div>
      <pre>${esc(c.content)}</pre><div class="row"><button data-a="edit">Edit</button><button data-a="toggle">${c.is_enabled ? "Disable" : "Enable"}</button><button data-a="del">Delete</button></div></div>`).join("") +
    (pages > 1 ? `<div class="row"><button data-p="${page - 1}" ${page <= 1 ? "disabled" : ""}>Previous</button><span class="muted">page ${page} of ${pages}</span><button data-p="${page + 1}" ${page >= pages ? "disabled" : ""}>Next</button></div>` : "");
  cell.querySelectorAll("[data-p]").forEach(b => b.onclick = () => showChunks(cell, id, +b.dataset.p));
  cell.querySelectorAll("[data-c]").forEach(div => {
    const cid = div.dataset.c, c = body.data.find(x => x.id === cid);
    div.querySelector('[data-a="del"]').onclick = async () => {
      if (!confirm("Delete this passage from search?")) return;
      try { await api(`/chunks/${id}/${cid}`, {method: "DELETE"}); } catch (e) { alert(e.message); }
      showChunks(cell, id, page);
    };
    div.querySelector('[data-a="toggle"]').onclick = async () => {
      try { await api(`/chunks/${id}/${cid}`, {method: "PUT", json: {is_enabled: !c.is_enabled}}); } catch (e) { alert(e.message); }
      showChunks(cell, id, page);
    };
    div.querySelector('[data-a="edit"]').onclick = () => {
      div.querySelector("pre").outerHTML = `<textarea rows="8">${esc(c.content)}</textarea>`;
      const button = div.querySelector('[data-a="edit"]');
      button.textContent = "Save";
      button.onclick = async () => {
        try { await api(`/chunks/${id}/${cid}`, {method: "PUT", json: {content: div.querySelector("textarea").value}}); } catch (e) { alert(e.message); }
        showChunks(cell, id, page);
      };
    };
  });
}

// --- agentic search (SSE) --------------------------------------------------------------------------
function renderAnswer(text, refs) {
  // escape everything, then turn the expanded <kb …/> tags into numbered marks
  const parts = String(text).split(/(<(?:kb|wiki|record)\b[^>]*\/>)/g);
  const seen = new Map();
  return parts.map(p => {
    const m = p.match(/^<(?:kb|wiki|record)\b([^>]*)\/>$/);
    if (!m) return esc(p);
    const doc = (m[1].match(/doc="([^"]*)"/) || [])[1] || "";
    const chunk = (m[1].match(/chunk_id="([^"]*)"/) || [])[1] || "";
    const n = (m[1].match(/ n="(\d+)"/) || [])[1];
    const source = (m[1].match(/source="([^"]*)"/) || [])[1] || doc;
    if (!seen.has(chunk)) seen.set(chunk, n || seen.size + 1);
    return `<sup class="cite" title="${source}">[${seen.get(chunk)}]</sup>`;
  }).join("");
}

async function agenticPane(pane, kb) {
  pane.innerHTML = `<form id="ask">
      <textarea name="q" placeholder="A question that needs several searches" required></textarea>
      <div class="row">
        <select name="preset">${presetOptions(kb)}</select>
        <select name="output"><option value="answer">answer</option><option value="evidence">evidence only</option></select>
        <label title="let the tool loop write wiki pages and your memory"><input type="checkbox" name="allow_writes"> allow changes</label>
        <button class="primary" name="go">Ask</button><button type="button" id="stop" disabled>Stop</button>
      </div></form>
    <div class="trail hidden" id="trail"></div><div id="result"></div>`;
  let controller = null;
  $("stop").onclick = () => controller && controller.abort();
  $("ask").onsubmit = async ev => {
    ev.preventDefault();
    const f = ev.target, trail = $("trail"), result = $("result");
    trail.innerHTML = ""; trail.classList.remove("hidden"); result.innerHTML = "";
    controller = new AbortController(); $("stop").disabled = false; f.go.disabled = true;
    const log = line => { trail.insertAdjacentHTML("beforeend", `<div>${esc(line)}</div>`); trail.scrollTop = trail.scrollHeight; };
    let answer = "";
    try {
      const r = await fetch(API + "/agentic-search", {method: "POST", credentials: "same-origin", signal: controller.signal,
        headers: {"Content-Type": "application/json"},
        body: JSON.stringify({query: f.q.value, knowledge_base_ids: [kb.id], preset: f.preset.value, output: f.output.value,
                              allow_writes: f.allow_writes.checked, stream: true})});
      if (!r.ok) { const b = await r.json().catch(() => null); throw new Error(b?.error?.message || "HTTP " + r.status); }
      const reader = r.body.getReader(), decoder = new TextDecoder();
      let buffer = "";
      for (;;) {
        const {value, done} = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, {stream: true});
        let cut;
        while ((cut = buffer.indexOf("\n\n")) >= 0) {
          const block = buffer.slice(0, cut); buffer = buffer.slice(cut + 2);
          const line = block.split("\n").find(l => l.startsWith("data: "));
          if (!line) continue;
          const fr = JSON.parse(line.slice(6));
          if (fr.response_type === "thinking") log("thinking: " + fr.content.slice(0, 300));
          else if (fr.response_type === "tool_call") log(`→ ${fr.data.tool_name} ${JSON.stringify(fr.data.arguments)}`);
          else if (fr.response_type === "tool_result") log(`← ${fr.data.tool_name} (${fr.data.duration_ms} ms)${fr.data.success ? "" : " error"}`);
          else if (fr.response_type === "context_compacted") log("context trimmed");
          else if (fr.response_type === "answer") { answer += fr.content; result.innerHTML = `<div class="answer">${renderAnswer(answer)}</div>`; }
          else if (fr.response_type === "error") fail(result, new Error(fr.content));
          else if (fr.response_type === "complete") showRun(result, fr.data, answer);
        }
      }
    } catch (e) { if (e.name !== "AbortError") fail(result, e); else log("stopped"); }
    finally { $("stop").disabled = true; f.go.disabled = false; controller = null; }
  };
}

const link = (text, url) => url ? `<a href="${esc(url)}" target="_blank" rel="noopener noreferrer">${esc(text)}</a>` : esc(text);

function showRun(result, data, answer) {
  const evidence = data.evidence.map((e, i) => `<div class="hit"><div class="meta">${esc(e.knowledge_title || e.title || e.kind)}${e.cited ? " · cited" : ""}${e.reason ? " · " + esc(e.reason) : ""}${e.score != null ? " · " + Number(e.score).toFixed(3) : ""}</div><pre>${esc((e.content || "").slice(0, 1200))}</pre></div>`).join("");
  const usage = data.usage || {};
  const route = data.route ? `<p class="muted">route: ${data.route.sources.map(s => `${esc(s)} (${data.route.counts[s] ?? 0})`).join(", ") || "none"}${data.route.reason ? " — " + esc(data.route.reason) : ""}</p>` : "";
  // the answer text ends with a plain "Sources:" list; show it as links instead
  const body = answer ? answer.replace(/\n\nSources:[\s\S]*$/, "") : "";
  const sources = (data.sources || []).length
    ? `<h3>Sources</h3><ol>${data.sources.map(s => `<li>${link(s.citation_text, s.url)}${s.cited ? "" : ' <span class="muted">(consulted, not cited inline)</span>'}</li>`).join("")}</ol>`
    : (answer ? '<p class="muted">Sources: none — nothing relevant was found in the knowledge bases.</p>' : "");
  result.innerHTML = (body ? `<div class="answer">${renderAnswer(body)}</div>` + sources : "") + route +
    ((data.writes || []).length ? `<h3>Changes made</h3><ul>${data.writes.map(w => `<li>${esc(w.tool)}: ${esc(w.target)} (${esc(w.action)})</li>`).join("")}</ul>` : "") +
    `<p class="muted">stopped: ${esc(data.stopped)} · ${data.steps.length} step(s) · ${usage.llm_calls || 0} model call(s) · ${usage.input_tokens || 0}+${usage.output_tokens || 0} tokens</p>` +
    (evidence ? `<h3>Evidence</h3>${evidence}` : "");
}

      <label><input type="checkbox" name="keep_versions" ${(kb.records_config || {}).keep_versions !== false ? "checked" : ""}> keep versions</label></div>` : ""}
    <div class="row"><button class="primary">Save</button> <button type="button" id="del-kb">Delete knowledge base</button></div></form>`;
  $("kb-settings").onsubmit = async ev => {
    ev.preventDefault();
    const f = ev.target;
    try {
      const body = {name: f.name.value, description: f.description.value, visibility: f.visibility.value,
        groups: f.groups.value.split(",").map(s => s.trim()).filter(Boolean)};
      if (f.wiki) { body.indexing_strategy = {wiki_enabled: f.wiki.checked}; body.wiki_config = {...(kb.wiki_config || {}), extraction_granularity: f.granularity.value}; }
      if (f.memory) body.memory_config = {enabled: f.memory.checked, group_id: f.memory_group.value || "default"};
      if (f.default_type) body.records_config = {...(kb.records_config || {}), default_type: f.default_type.value || null,
        strict: f.strict.checked, keep_versions: f.keep_versions.checked};
      await api(`/knowledge-bases/${kb.id}`, {method: "PUT", json: body});
      if (f.wiki && f.wiki.checked && !wikiOn(kb) && confirm("Build the wiki from the existing documents now?"))
        await api(`/knowledgebase/${kb.id}/wiki/rebuild`, {method: "POST"});
      state.kb = null; await loadKbs(kb.id);
    } catch (e) { fail(pane, e); }
  };
  $("del-kb").onclick = async () => {
    if (!confirm(`Delete "${kb.name}" and everything in it?`)) return;
    const purge = confirm("Erase it from the database right away?\n\nOK: erased now, it cannot be recovered.\nCancel: its documents' text and files are removed now, and the empty records are erased after the retention period.");
    try { await api(`/knowledge-bases/${kb.id}?purge=${purge}`, {method: "DELETE"}); state.kb = null; $("kb-view").classList.add("hidden"); $("empty").classList.remove("hidden"); loadKbs(); }
    catch (e) { fail(pane, e); }
  };
}

// --- shared helpers (phase 3) ---------------------------------------------------------------------
const utc = iso => iso ? new Date(iso).toISOString().slice(0, 16).replace("T", " ") + "Z" : "";
const fmt = v => v == null ? "" : typeof v === "number" ? (Number.isInteger(v) ? String(v) : v.toPrecision(4)) :
  typeof v === "object" ? JSON.stringify(v) : String(v);
function table(columns, rows) {
  if (!rows.length) return '<p class="muted">No rows.</p>';
  return `<table><thead><tr>${columns.map(c => `<th>${esc(c)}</th>`).join("")}</tr></thead><tbody>${
    rows.map(r => `<tr>${columns.map(c => `<td>${esc(fmt(r[c]))}</td>`).join("")}</tr>`).join("")}</tbody></table>`;
}
function parseJson(text, fallback) {
  if (!text || !text.trim()) return fallback;
  try { return JSON.parse(text); } catch (e) { throw new Error("not valid JSON: " + e.message); }
}

        out.innerHTML = table(["name", "score", "text", "facets", "features"], r.records.map(x => ({name: x.name, score: x.score, ...x.breakdown})));

// --- wiki -------------------------------------------------------------------------------------------------
function renderWiki(md, known) {
  const inline = text => esc(text)
    .replace(/\[\[([^\[\]|]+?)(?:\|([^\[\]]+?))?\]\]/g, (m, slug, title) =>
      `<a class="wl${known && !known.has(slug) ? " dead" : ""}" data-slug="${slug}">${title || slug}</a>`)
    .replace(/\[src:(\d+)\]/g, '<sup class="src" title="source passage $1">[$1]</sup>')
    .replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  const out = [];
  let list = false;
  for (const line of String(md || "").split("\n")) {
    const heading = line.match(/^(#{1,3})\s+(.*)$/);
    const item = line.match(/^\s*[-*]\s+(.*)$/);
    if (!item && list) { out.push("</ul>"); list = false; }
    if (heading) out.push(`<h${heading[1].length}>${inline(heading[2])}</h${heading[1].length}>`);
    else if (item) { if (!list) { out.push("<ul>"); list = true; } out.push(`<li>${inline(item[1])}</li>`); }
    else if (line.trim()) out.push(`<p>${inline(line)}</p>`);
  }
  if (list) out.push("</ul>");
  return out.join("");
}

async function showWikiPage(kb, slug, known) {
  const base = `/knowledgebase/${kb.id}/wiki`;
  const view = $("w-view");
  document.querySelectorAll("#w-list a").forEach(a => a.classList.toggle("on", a.dataset.slug === slug));
  let page;
  try { page = (await api(`${base}/pages/${slug}`)).data; } catch (e) { view.innerHTML = ""; fail(view, e); return; }
  view.innerHTML = `<div class="row"><h2 style="margin:0;flex:1">${esc(page.title)}</h2><span class="badge">${esc(page.page_type)}</span><span class="muted">v${page.version} · ${esc(page.last_edit_source)}</span></div>
    ${page.summary ? `<p class="muted">${esc(page.summary)}</p>` : ""}
    <div class="row">${page.page_type !== "index" ? '<button id="wp-edit">Edit</button><button id="wp-history">History</button><button id="wp-flag">Flag issue</button><button id="wp-del">Delete</button>' : ""}</div>
    <div class="wiki-page">${renderWiki(page.content, known)}</div>
    ${page.source_refs.length ? `<h3>Sources</h3><ul>${page.source_refs.map(r => `<li>${esc(r.split("|").slice(1).join("|") || r)}</li>`).join("")}</ul>` : ""}
    ${page.in_links.length ? `<h3>Linked from</h3>${page.in_links.map(s => `<a class="wl" data-slug="${esc(s)}">${esc(s)}</a>`).join(" · ")}` : ""}`;
  view.querySelectorAll("a.wl").forEach(a => a.onclick = () => showWikiPage(kb, a.dataset.slug, known));
  if (page.page_type === "index") return;
  $("wp-edit").onclick = () => editWikiPage(kb, page, known);
  $("wp-del").onclick = async () => { if (confirm("Delete this page? Links to it become plain text.")) { await api(`${base}/pages/${slug}`, {method: "DELETE"}); wikiPane($("pane"), kb); } };
  $("wp-flag").onclick = async () => {
    const description = prompt("What is wrong with this page?");

  $("wp-history").onclick = async () => {
    const h = (await api(`${base}/revisions/${slug}`)).data;
    view.insertAdjacentHTML("beforeend", `<h3>History</h3>` + (h.revisions.map(r => `<div class="row" data-v="${r.version}">v${r.version} · ${esc(r.edit_source)} ${esc(r.editor || "")} · ${esc(r.created_at.slice(0, 16))}
      <button data-a="view">View</button><button data-a="revert">Revert to this</button></div>`).join("") || '<p class="muted">No earlier versions.</p>'));
    view.querySelectorAll("[data-v]").forEach(row => row.querySelectorAll("button").forEach(b => b.onclick = async () => {
      if (b.dataset.a === "view") {
        const r = (await api(`${base}/revisions/${slug}?version=${row.dataset.v}`)).data;
        row.insertAdjacentHTML("afterend", `<pre class="json">${esc(r.content)}</pre>`);
      } else { await api(`${base}/revert`, {method: "POST", json: {slug, version: Number(row.dataset.v)}}); showWikiPage(kb, slug, known); }
    }));
  };
}

function editWikiPage(kb, page, known) {
  const base = `/knowledgebase/${kb.id}/wiki`;
  $("w-view").innerHTML = `<form id="wp-form">
    <div class="row"><input name="title" placeholder="Title" value="${esc(page ? page.title : "")}" style="flex:1" required>
      ${page ? "" : '<select name="page_type"><option>synthesis</option><option>comparison</option><option>entity</option><option>concept</option></select><input name="folder" placeholder="folder (optional)">'}</div>

    <textarea name="content" style="min-height:300px" required>${esc(page ? page.content : "")}</textarea>

    <div class="row"><button class="primary">Save</button><button type="button" id="wp-cancel">Cancel</button></div></form>`;
  $("wp-cancel").onclick = () => page ? showWikiPage(kb, page.slug, known) : ($("w-view").innerHTML = "");
  $("wp-form").onsubmit = async ev => {

  f.onsubmit = async ev => {
    ev.preventDefault();
    const body = {name: f.name.value.trim(), url: f.url.value.trim(), [f.kind.value]: f.secret.value,
                  knowledge_bases: f.knowledge_bases.value.split(/\s+/).filter(Boolean)};
    if (f.kind.value === "pat") Object.assign(body, {auth_url: f.auth_url.value, client_id: f.client_id.value, resource: f.resource.value});

async function listRemotes() {
  const box = $("remote-list");
  const remotes = (await api("/remotes")).data;
  if (!remotes.length) { box.innerHTML = '<p class="muted">No remote yet: add one below.</p>'; return; }
  box.innerHTML = remotes.map(r => `<div class="hit" data-id="${esc(r.id)}">
    <div class="row"><b>${esc(r.name)}</b>${r.is_builtin ? ' <span class="badge">kb.cfg</span>' : ""}
      <span class="muted" style="flex:1">${esc(r.url)}</span>
      <label><input type="checkbox" class="r-on" ${r.is_enabled ? "checked" : ""}> on</label>
      <button class="r-refresh">Refresh</button>${r.is_builtin ? "" : '<button class="r-del">Remove</button>'}</div>
    <div class="r-kbs muted">${r.is_enabled ? "Loading…" : "Switched off."}</div></div>`).join("");
  for (const card of box.querySelectorAll(".hit")) {
    const id = card.dataset.id, r = remotes.find(x => x.id === id);
    card.querySelector(".r-on").onchange = async ev => {
      try { await api(`/remotes/${id}`, {method: "PUT", json: {is_enabled: ev.target.checked}}); await listRemotes(); loadKbs(); }
      catch (e) { ev.target.checked = !ev.target.checked; fail(card, e); }
    };
    card.querySelector(".r-refresh").onclick = () => remoteKbs(card, id, true);
    const del = card.querySelector(".r-del");
    if (del) del.onclick = async () => {
      if (!confirm(`Remove the remote ${r.name}? Its knowledge bases stay on the remote.`)) return;
      try { await api(`/remotes/${id}`, {method: "DELETE"}); await listRemotes(); loadKbs(); } catch (e) { fail(card, e); }
    };
    if (r.is_enabled) remoteKbs(card, id, false);
  }
}

async function remoteKbs(card, id, refresh) {
  const box = card.querySelector(".r-kbs");
  box.textContent = "Loading…";
  try {
    const data = (await api(`/remotes/${id}/knowledge-bases${refresh ? "?refresh=true" : ""}`)).data;
    if (data.error) { box.innerHTML = `<span class="error">${esc(data.error)}</span>`; return; }
    if (!data.knowledge_bases.length) { box.textContent = "This remote offers no knowledge base to you."; return; }
    box.classList.remove("muted");
    box.innerHTML = `<table><thead><tr><th>on</th><th>name</th><th>ref</th><th>type</th><th>items</th></tr></thead><tbody>${
      data.knowledge_bases.map(kb => `<tr><td><input type="checkbox" data-kb="${esc(kb.remote_id)}" ${kb.enabled ? "checked" : ""}></td>
        <td>${esc(kb.name)}</td><td>${esc(kb.ref.split(":").slice(2).join(":"))}</td><td>${esc(kb.type)}</td>
        <td>${esc(kb.knowledge_count ?? "")}</td></tr>`).join("")}</tbody></table>`;
    box.querySelectorAll("input[data-kb]").forEach(cb => cb.onchange = async () => {
      try { await api(`/remotes/${id}/knowledge-bases/${encodeURIComponent(cb.dataset.kb)}`, {method: "PUT", json: {enabled: cb.checked}}); loadKbs(); }
      catch (e) { cb.checked = !cb.checked; fail(box, e); }
    });
  } catch (e) { box.innerHTML = ""; fail(box, e); }
}

  const kinds = (await api("/web-search/providers")).data;

async function listWeb() {
  const [providers, prefs] = await Promise.all([api("/web-search-providers"), api("/web-search/preferences")]).then(r => r.map(x => x.data));
  const save = async change => {
    try { await api("/web-search/preferences", {method: "PUT", json: change}); } catch (e) { alert(e.message); }
    listWeb();
  };
  $("web-list").innerHTML = providers.length ? `<table><thead><tr><th>Provider</th><th>Default</th><th>On</th><th></th></tr></thead><tbody>${providers.map(p => `<tr data-ref="${esc(p.ref)}" data-id="${esc(p.id)}">
    <td>${esc(p.name)} <span class="muted">${esc(p.title)} · ${p.is_builtin ? "deployment" : "yours"}${p.is_builtin && p.is_default ? " · deployment default" : ""}${p.status !== "active" ? " · " + esc(p.status) : ""}</span>${p.parameters.api_key ? `<div class="muted">key ${esc(p.parameters.api_key)}</div>` : ""}</td>
    <td><input type="radio" name="web-default" ${p.is_my_default ? "checked" : ""} ${p.enabled && p.status === "active" ? "" : "disabled"} title="use this one when no provider is named"></td>
    <td><input type="checkbox" data-a="on" ${p.enabled ? "checked" : ""}></td>
    <td><button data-a="test">Test</button>${p.is_builtin ? "" : ' <button data-a="del">Delete</button>'}<span class="muted" data-out></span></td></tr>`).join("")}</tbody></table>
    <p class="muted">${prefs.effective ? `Searches use <b>${esc(prefs.effective.name)}</b> unless a provider is named.` : "No provider is on: web search is unavailable for you."}${prefs.default ? ' <a href="#" id="web-unset">Use the deployment default</a>' : ""}</p>`
    : '<p class="muted">No web search provider is configured. Add your own below, or ask the operator to configure one in kb.cfg.</p>';
  $("web-unset")?.addEventListener("click", ev => { ev.preventDefault(); save({default: null}); });
  $("web-list").querySelectorAll("tr[data-ref]").forEach(tr => {
    const ref = tr.dataset.ref, id = tr.dataset.id;
    tr.querySelector("input[type=radio]").onchange = () => save({default: ref});
    tr.querySelector('[data-a="on"]').onchange = ev => {
      const off = new Set(prefs.disabled);
      ev.target.checked ? off.delete(id) : off.add(id);
      save({disabled: [...off], ...(prefs.default === id && !ev.target.checked ? {default: null} : {})});
    };
    tr.querySelector('[data-a="test"]').onclick = async () => {
      const out = tr.querySelector("[data-out]"); out.textContent = " testing…";
      try { const r = (await api(`/web-search-providers/${encodeURIComponent(ref)}/test`, {method: "POST", json: {}})).data;
        out.textContent = r.ok ? ` works (${plural(r.results.length, "result")})` : ` failed: ${r.error}`; }
      catch (e) { out.textContent = " " + e.message; }
    };
    tr.querySelector('[data-a="del"]')?.addEventListener("click", async () => {
      if (!confirm("Delete this provider?")) return;
      try { await api(`/web-search-providers/${encodeURIComponent(ref)}`, {method: "DELETE"}); } catch (e) { alert(e.message); }
      listWeb();
    });
  });
}

const factRows = facts => facts.map(f => ({source: f.source, relation: f.relation, target: f.target, fact: f.fact,
  valid: `${f.valid_at ? utc(f.valid_at).slice(0, 10) : "?"} → ${f.invalid_at ? utc(f.invalid_at).slice(0, 10) : "now"}`,
  learned: utc(f.created_at).slice(0, 10)}));

// Remove sensitive text from the whole memory: episodes, facts and entities (preview first).
const memoryRedactBox = `<details><summary class="muted">Remove sensitive text (bank details, personal data …) from my memory</summary>
  <form id="m-redact" class="row"><textarea name="terms" rows="2" placeholder="text to remove, one per line" style="flex:1" required></textarea>
    <button name="preview">Preview</button><button type="button" name="apply" class="primary" disabled>Redact</button></form>
  <div id="m-redact-out" class="muted"></div></details>`;

function memoryRedact(after) {
  const f = $("m-redact"), body = dry => ({terms: f.terms.value.split("\n").map(s => s.trim()).filter(Boolean), dry_run: dry});
  const summary = r => `${plural(r.matches, "match", "matches")}: ${plural(r.episodes, "episode")}, ${plural(r.facts, "fact")}, ${plural(r.entities, "entity", "entities")}`;
  f.terms.oninput = () => { f.apply.disabled = true; };
  f.onsubmit = async ev => {
    ev.preventDefault();
    try { const r = (await api("/memory/redact", {method: "POST", json: body(true)})).data;
      $("m-redact-out").textContent = r.matches ? summary(r) + "." : "No matches."; f.apply.disabled = !r.matches; }
    catch (e) { fail($("m-redact-out"), e); }
  };
  f.apply.onclick = async () => {
    if (!confirm("Replace every match in your memory with [REDACTED]? This cannot be undone.")) return;
    try { const r = (await api("/memory/redact", {method: "POST", json: body(false)})).data;
      $("m-redact-out").textContent = "Redacted " + summary(r) + "."; f.reset(); f.apply.disabled = true; after(); }
    catch (e) { fail($("m-redact-out"), e); }
  };
}

async function memoryFacts(pane) {
  pane.innerHTML = memoryRedactBox + `<form id="m-facts" class="row"><input name="q" placeholder="text"><input name="entity" placeholder="entity">
    <label>as of <input name="as_of" type="date"></label><label><input type="checkbox" name="include_invalid"> include invalidated</label>
    <input name="group_id" placeholder="group (all)"><button>Show</button></form><div id="m-out"></div>`;
  const show = async () => {
    const f = $("m-facts"), params = new URLSearchParams();
    for (const k of ["q", "entity", "group_id"]) if (f[k].value) params.set(k, f[k].value);
    if (f.as_of.value) params.set("as_of", f.as_of.value + "T23:59:59Z");
    if (f.include_invalid.checked) params.set("include_invalid", "true");
    try {
      const facts = (await api(`/memory/facts?${params}`)).data, rows = factRows(facts);
      const cols = ["source", "relation", "target", "fact", "valid", "learned"];
      $("m-out").innerHTML = facts.length ? `<table><thead><tr>${cols.map(c => `<th>${c}</th>`).join("")}<th></th></tr></thead><tbody>${
        rows.map((r, i) => `<tr data-id="${esc(facts[i].id)}">${cols.map(c => `<td>${esc(fmt(r[c]))}</td>`).join("")}<td><button>Forget</button></td></tr>`).join("")}</tbody></table>` : '<p class="muted">No rows.</p>';
      $("m-out").querySelectorAll("tr[data-id]").forEach(tr => tr.querySelector("button").onclick = async () => {
        if (!confirm("Forget this fact? The episodes it came from keep their text: use Remove sensitive text for that.")) return;
        try { await api(`/memory/facts/${tr.dataset.id}`, {method: "DELETE"}); } catch (e) { alert(e.message); }
        show();
      });
    }
    catch (e) { $("m-out").innerHTML = ""; fail($("m-out"), e); }
  };
  $("m-facts").onsubmit = ev => { ev.preventDefault(); show(); };
  memoryRedact(show);
  await show();
}

async function memoryEntities(pane) {
  pane.innerHTML = memoryRedactBox + `<form id="m-ents" class="row"><input name="q" placeholder="name"><input name="group_id" placeholder="group (all)"><button>Show</button></form><div id="m-out"></div>`;
  const show = async () => {
    const f = $("m-ents"), params = new URLSearchParams({page_size: "100"});
    for (const k of ["q", "group_id"]) if (f[k].value) params.set(k, f[k].value);
    try {
      const body = await api(`/memory/entities?${params}`);
      $("m-out").innerHTML = body.data.length ? `<table><thead><tr><th>Name</th><th>Type</th><th>Summary</th><th>Group</th><th></th></tr></thead><tbody>${
        body.data.map(e => `<tr data-id="${esc(e.id)}"><td>${esc(e.name)}${e.aliases?.length ? `<div class="muted">${esc(e.aliases.join(", "))}</div>` : ""}</td><td>${esc(e.entity_type)}</td><td>${esc(e.summary)}</td><td>${esc(e.group_id)}</td><td><button>Forget</button></td></tr>`).join("")}</tbody></table>` +
        (body.total > body.data.length ? `<p class="muted">${body.total} entities; showing ${body.data.length}.</p>` : "") : '<p class="muted">No entities.</p>';
      $("m-out").querySelectorAll("tr[data-id]").forEach(tr => tr.querySelector("button").onclick = async () => {
        if (!confirm("Forget this entity and every fact about it?")) return;
        try { const r = (await api(`/memory/entities/${tr.dataset.id}`, {method: "DELETE"})).data;
          alert(`${plural(r.facts_removed, "fact")} removed. The episodes they came from keep their text: use Remove sensitive text for that.`); }
        catch (e) { alert(e.message); }
        show();
      });
    } catch (e) { $("m-out").innerHTML = ""; fail($("m-out"), e); }
  };
  $("m-ents").onsubmit = ev => { ev.preventDefault(); show(); };
  memoryRedact(show);
  await show();
}

async function memoryEpisodes(pane) {
  pane.innerHTML = `<form id="m-add"><textarea name="content" placeholder="Something to remember: a note, a decision, what happened…" required></textarea>
    <div class="row"><label>when <input name="reference_time" type="datetime-local"></label><input name="group_id" placeholder="group (default)"><button class="primary">Remember</button></div></form>
    <div id="m-list"></div>`;
  const list = async () => {
    const body = await api("/memory/episodes?page_size=50");
    $("m-list").innerHTML = body.data.map(e => `<div class="hit" data-id="${esc(e.id)}"><div class="meta">${esc(utc(e.reference_time))} · ${esc(e.source)} · ${esc(e.group_id)} · <span class="badge ${e.status === "processed" ? "completed" : e.status}">${esc(e.status)}</span>
      <button data-a="del">Forget</button></div><pre>${esc(e.content.slice(0, 600))}</pre>${e.error ? `<div class="error">${esc(e.error)}</div>` : ""}</div>`).join("") || '<p class="muted">Nothing remembered yet.</p>';
    $("m-list").querySelectorAll(".hit").forEach(div => div.querySelector("button").onclick = async () => {
      if (!confirm("Forget this episode? Facts only it supported are removed.")) return;
      const r = (await api(`/memory/episodes/${div.dataset.id}`, {method: "DELETE"})).data;
      alert(`${r.facts_removed} fact(s) removed, ${r.invalidations_reverted} invalidation(s) reverted.`); list();
    });
  };
  $("m-add").onsubmit = async ev => {
    ev.preventDefault();
    const f = ev.target, body = {content: f.content.value};
    if (f.reference_time.value) body.reference_time = new Date(f.reference_time.value).toISOString();
    if (f.group_id.value) body.group_id = f.group_id.value;
    try { await api("/memory/episodes", {method: "POST", json: body}); f.reset(); list(); } catch (e) { fail(pane, e); }
  };
  await list();
}

async function memorySearch(pane) {
  pane.innerHTML = `<form id="m-search" class="row"><input name="query" placeholder="what do I know about…" style="flex:2" required>
    <input name="focal_entity" placeholder="around entity"><label>as of <input name="as_of" type="date"></label><button class="primary">Search</button></form><div id="m-out"></div>`;
  $("m-search").onsubmit = async ev => {
    ev.preventDefault();
    const f = ev.target, body = {query: f.query.value};
    if (f.focal_entity.value) body.focal_entity = f.focal_entity.value;
    if (f.as_of.value) body.as_of = f.as_of.value + "T23:59:59Z";
    try { $("m-out").innerHTML = table(["source", "relation", "target", "fact", "valid", "learned"], factRows((await api("/memory/search", {method: "POST", json: body})).data)); }
    catch (e) { $("m-out").innerHTML = ""; fail($("m-out"), e); }
  };
}

const PANES = {documents: documentsPane, search: searchPane, agentic: agenticPane, tags: tagsPane, faq: faqPane,
               freshness: freshnessPane, settings: settingsPane, records: recordsPane, query: queryPane,
               types: typesPane, wiki: wikiPane};

$("new-kb").onsubmit = async ev => {
  ev.preventDefault();
  const f = ev.target, body = {name: f.name.value, type: f.type.value};
  if (body.type === "document") {
    if (FEATURES.wiki) body.indexing_strategy = {wiki_enabled: f.wiki.checked};
    if (FEATURES.memory) body.memory_config = {enabled: f.memory.checked};
  }
  try { const kb = (await api("/knowledge-bases", {method: "POST", json: body})).data; f.reset(); await loadKbs(kb.id); }
  catch (e) { fail($("kbs"), e); }
};

// status changes arrive on the event stream; refresh the document list when one is shown
function listen() {
  if (!window.EventSource) return;
  const source = new EventSource(API + "/events");
  let timer = null;
  source.onmessage = ev => {
    try { const e = JSON.parse(ev.data); if (!state.kb || e.knowledge_base_id !== state.kb.id || state.tab !== "documents") return; } catch (_) { return; }
    // not while a passage is being edited (re-rendering would drop the edit)
    clearTimeout(timer); timer = setTimeout(() => state.kb && !document.querySelector("#docs textarea") && listDocs(state.kb).catch(() => {}), 400);
  };
}

loadMe().then(() => loadKbs()).then(openFromHash).catch(e => fail($("kbs"), e)); listen();
</script>
