name: Build container

# Tests on every push and pull request; the image is built and smoke-tested in all three run modes,
# and published to ghcr.io when a tag is pushed.
on:
  push:
    branches: ["main"]
    tags: ["*"]
  pull_request:
  workflow_dispatch:
    inputs:
      agenticwf_ref:
        description: AgenticWF-auth ref (tag) providing authsvc
        required: false

# Read-only by default; only the publish step may write packages.
permissions:
  contents: read

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/agenticwf-kb
  # authsvc comes from this AgenticWF-auth ref; keep it at the version of the deployed auth image.
  AGENTICWF_REPO: InnovateAILab/AgenticWF-auth
  AGENTICWF_REF: ${{ inputs.agenticwf_ref || vars.AGENTICWF_REF || 'main' }}
  # The test database: ParadeDB's image has pgvector, pg_search and pg_trgm. Keep the pg_search
  # version in step with PG_SEARCH_VERSION in container/Dockerfile.
  PARADEDB_IMAGE: paradedb/paradedb:0.25.11-pg16

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: paradedb/paradedb:0.25.11-pg16
        env:
          POSTGRES_PASSWORD: test
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.AGENTICWF_REPO }}
          ref: ${{ env.AGENTICWF_REF }}
          path: .agenticwf
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          pip install ./.agenticwf/authsvc
          pip install -e '.[test]'
      - name: Create the extensions (the container's entrypoint does this as the superuser)
        env:
          PGPASSWORD: test
        run: |
          psql -h 127.0.0.1 -U postgres -v ON_ERROR_STOP=1 \
            -c 'CREATE EXTENSION IF NOT EXISTS vector' \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_trgm' \
            -c 'CREATE EXTENSION IF NOT EXISTS pg_search'
      - name: Test against PostgreSQL (vector, pg_trgm, pg_search)
        env:
          KB_TEST_DB_URL: postgresql+psycopg://postgres:test@127.0.0.1:5432/postgres
        run: pytest -q

  container:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Check the authsvc ref
        if: github.ref_type == 'tag' && env.AGENTICWF_REF == 'main'
        run: echo "::warning::authsvc is built from AgenticWF-auth main; set the AGENTICWF_REF repository variable to the deployed auth release"
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: ${{ env.AGENTICWF_REPO }}
          ref: ${{ env.AGENTICWF_REF }}
          path: .agenticwf
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./.agenticwf/authsvc

      - uses: docker/setup-buildx-action@v3

      - name: Build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          build-contexts: |
            authsvc=.agenticwf/authsvc
          platforms: linux/amd64
          load: true
          tags: agenticwf-kb:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test (standalone, authsvc, service)
        run: scripts/smoke-container.sh agenticwf-kb:ci

      - if: github.ref_type == 'tag'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - if: github.ref_type == 'tag'
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
          labels: |
            org.opencontainers.image.version=${{ github.ref_name }}
            org.agenticwf.authsvc-ref=${{ env.AGENTICWF_REF }}

      - if: github.ref_type == 'tag'
        name: Publish
        uses: docker/build-push-action@v6
        with:
          context: .
          file: container/Dockerfile
          build-contexts: |
            authsvc=.agenticwf/authsvc
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
