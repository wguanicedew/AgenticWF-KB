; supervisord for the AgenticWF knowledge service container (main settings only).
; Programs inherit the environment prepared by /usr/local/bin/entrypoint.sh.
; Logs go to the container's stdout/stderr (docker/podman logs).

[supervisord]
nodaemon=true
user=root
logfile=/dev/null
logfile_maxbytes=0
pidfile=/run/supervisord.pid

[unix_http_server]
file=/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///run/supervisor.sock

[include]
; One file per program, see /etc/supervisord.d/*.ini
files = /etc/supervisord.d/*.ini
