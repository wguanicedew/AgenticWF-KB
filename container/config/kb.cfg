# AgenticWF knowledge service configuration (ConfigParser INI), installed as /etc/agenticwf/kb.cfg.
# Every section and key, with defaults: docs/configuration.md. Mount your own over this file
# (-v /etc/agenticwf/kb.cfg:/etc/agenticwf/kb.cfg:ro) to change it.

[database]
# The container's PostgreSQL over its Unix socket, peer authentication (OS user kb = role kb).
# An external server: postgresql+psycopg://kb:<password>@host:5432/kb (write % as %%).
default = postgresql+psycopg://kb@/kb?host=/run/postgresql
pool_size = 10
max_overflow = 10
pool_recycle = 3600
# required_extensions = vector pg_trgm pg_search

[logging]
level = INFO
# file = /var/lib/agenticwf-kb/logs/kb.log

[storage]
backend = local
root = /var/lib/agenticwf-kb/files
max_file_mb = 50

[retrieval]
# One BM25 index for the deployment (ParadeDB pg_search); changing it means reindexing.
bm25_tokenizer = icu

[ingestion]
chunk_size = 512
chunk_overlap = 50
strategy = auto

[workers]
queues = default postprocess wiki
concurrency = 3
poll_seconds = 1

# Models: one section per model (docs/configuration.md, System models). A chat model that
# agentic search uses needs supports_tools = true.
# [models]
# default_embedding = bge-m3
# default_chat = small
#
# [models.chat.small]
# provider = openai_compat
# base_url = https://api.openai.com/v1
# model = gpt-4o-mini
# api_key_env = OPENAI_API_KEY
# supports_tools = true

[websearch]
# Web search for the smart preset and the agent ([features] web; docs/web-search.md).
default = ddg
# fetch_top = 3

[websearch.ddg]
kind = duckduckgo

# [websearch.brave]
# kind = brave
# api_key_env = BRAVE_API_KEY

# A remote KB server whose system and group KBs a standalone KB also lists and searches
# (docs/retrieval.md, Remote knowledge bases). Standalone mode only.
# [remote.central]
# url = https://host.example.org/app/kb
# pat_file = /var/lib/agenticwf-kb/secrets/central_pat
# auth_url = https://auth.example.org
# client_id = <Logto native app id>
# resource = https://api.example.org
# knowledge_bases = system:eic-docs

[agentic]
# Agentic search (docs/agentic-search.md). Empty model: [models] default_chat; it needs
# supports_tools = true (see [models.chat.*] below) for the smart, deep and wiki presets.
# model = system:small
# The preset a request without one uses; deep while smart is unavailable ([features] web off).
default_preset = smart
max_iterations = 10
timeout = 180
per_owner = 2

[faq]
priority_enabled = true
score_boost = 1.2
direct_answer_threshold = 0.9

[features]
faq = true
records = false
wiki = true
memory = true
web = true
remote = true

# What a new document KB starts with (docs/configuration.md, [knowledge_bases]); each KB's
# owner can switch either off in its settings.
[knowledge_bases]
wiki_enabled = true
memory_enabled = true

# Phase 3 features (switched on or off above). Defaults shown; docs/configuration.md.
[records]
plugins = hpo
# statement_timeout = 5
# max_rows = 1000

[wiki]
# synthesis_model =                 # default: [models] default_chat
# extraction_granularity = standard # focused | standard | exhaustive
# ingest_batch_size = 5

[memory]
