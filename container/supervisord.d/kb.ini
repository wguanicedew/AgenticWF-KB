; The KB API, main listener in KB_AUTH_MODE (standalone: published port; authsvc: Caddy's
; upstream on 127.0.0.1:8020; service: the agent's backend).
[program:kb]
command=/usr/local/bin/start-kb.sh
user=kb
directory=/home/kb
environment=HOME="/home/kb"
priority=30
autorestart=true
startsecs=5
; start-kb.sh itself waits for the database; beyond that, a program that keeps failing becomes
; FATAL and fatal.ini stops the container for Docker to restart.
startretries=10
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
