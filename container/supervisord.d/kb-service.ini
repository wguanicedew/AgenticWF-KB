; Optional second listener in service mode, for the agent (KB_SERVICE_LISTEN; docs/run-modes.md).
; Off unless KB_SERVICE_LISTEN is set.
[program:kb-service]
command=/usr/local/bin/log-prefix.sh kb-service /usr/local/bin/start-kb-service.sh
autostart=%(ENV_KB_SERVICE_AUTOSTART)s
user=kb
directory=/home/kb
environment=HOME="/home/kb"
priority=31
autorestart=true
startsecs=5
startretries=10
stopwaitsecs=30
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
