; Worker processes beside the API (KB_WORKER_PROCESSES; docs/ingestion.md, Tasks and workers).
; Off unless KB_WORKER_PROCESSES > 0: then the API enqueues and these run the tasks.
[program:kb-worker]
command=/usr/local/bin/log-prefix.sh kb-worker-%(process_num)s /usr/local/bin/start-kb-worker.sh
process_name=%(program_name)s-%(process_num)s
numprocs=%(ENV_KB_WORKER_SLOTS)s
autostart=%(ENV_KB_WORKERS_AUTOSTART)s
user=kb
directory=/home/kb
environment=HOME="/home/kb"
priority=40
autorestart=true
startsecs=5
startretries=10
; a task in flight is re-queued on SIGTERM
stopwaitsecs=60
stopasgroup=true
killasgroup=true
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
redirect_stderr=true
