; Stop the container when a program enters FATAL, so Docker's restart policy can start it again
; (container/scripts/supervisor-fatal.sh).
[eventlistener:fatal]
command=/usr/local/bin/supervisor-fatal.sh
events=PROCESS_STATE_FATAL
priority=1
autorestart=true
stdout_logfile=NONE
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
